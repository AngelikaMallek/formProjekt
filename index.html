<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form App</title>
  </head>
  <body>
     <div class="container">
        <header>
            <h1 class="container__heading">Formularz kontaktowy</h1>
        </header>
        <section class="section">
            <h2 class="section__heading">Podaj swoje dane</h2>
            <form class="form">
              <div>
                <label>
                  Name:
                  <input class="form__field" type="text" placeholder="Name">
                </label>
                <div class="errors" data-input="name"></div>
              </div>
              <div>
                <label>
                  Email:
                  <input class="form__field" type="text" placeholder="Email">
                </label>
                <div class="errors" data-input="email"></div>
              </div>
              <div>
                <label>
                  Age:
                  <input class="form__field" type="number" placeholder="Age">
                </label>
                <div class="errors" data-input="age"></div>
              </div>
              <div>
                <label>
                  Phone:
                  <input class="form__field" type="text" placeholder="Phone">
                </label>
                <div class="errors" data-input="phone"></div>
              </div>
              <div>
                <label>
                  Message:
                  <input class="form__field" type="text" placeholder="Message">
                </label>
                <div class="errors" data-input="message"></div>
              </div> 
              <button class="form__button">Wyślij</button>
            </form>
        </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
