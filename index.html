<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/container.css">
    <link rel="stylesheet" href="CSS/form.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/section.css">
    <link rel="stylesheet" href="CSS/list.css">
    <script type="module" src="src/main.js"></script>
    <title>Form App</title>
  </head>
  <body class="body">
     <div class="container">
        <header>
            <h1 class="container__heading">To do app</h1>
        </header>
        <section class="section">
            <h2 class="section__heading">Give a task to do</h2>
            <form class="form" id="taskForm">
              <div>
                <label class="form__element">
                  Topic:
                  <input class="form__field" type="text" placeholder="Topic" name="topic">
                </label>
                <div class="errors" data-input="topic"></div>
              </div>
              <div>
                <label class="form__element">
                  Description:
                  <input class="form__field" type="text" placeholder="Description" name="description">
                </label>
                <div class="errors" data-input="description"></div>
              </div>
              <button class="form__button" type="submit">Send</button>
            </form>
        </section>
        <section class="section">
            <h2 class="section__heading">Tasks list</h2>
            <ul class="list" id="taskList"></ul>
        </section>
    </div>
  </body>
</html>
